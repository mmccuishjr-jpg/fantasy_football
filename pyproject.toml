[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-league-mcp"
version = "0.1.0"
description = "Read-only Sleeper fantasy football league snapshot and MCP server"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.20.0,<2",
]

[project.scripts]
sleeper-refresh = "sleeper_mcp.refresh:main"
sleeper-mcp = "sleeper_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

